<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FusionGuard V3 - Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <h1>FusionGuard V3</h1>
        <p class="subtext">Administrator access for enrolment, monitoring, incidents, guest keys and audit-controlled security actions.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>

        <a class="button secondary" href="{{ url_for('guest_access') }}">Guest Key Entry</a>
    </main>
</body>
</html>
